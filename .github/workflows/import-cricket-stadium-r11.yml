name: Import Cricket Stadium R11

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-cricket-stadium-r11.yml"

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download verified R11 GLB
        run: |
          set -euo pipefail
          mkdir -p public/models
          curl --fail --location --retry 2             "https://d2ol7oe51mr4n9.cloudfront.net/user_3BjwTJYCzFGxri4Mx2xQr2GkqBc/4c6e3706-78f5-4133-b1ae-a66742e2e3da.zip"             -o /tmp/cricket-stadium-colosseum-r11.zip
          unzip -j /tmp/cricket-stadium-colosseum-r11.zip             cricket-stadium-colosseum-r11.glb             -d public/models
          python - <<'PY'
          from pathlib import Path
          p=Path("public/models/cricket-stadium-colosseum-r11.glb")
          data=p.read_bytes()
          assert len(data)==6006492, f"unexpected GLB size: {len(data)}"
          assert data[:4]==b"glTF", "invalid GLB header"
          print("verified", len(data), data[:4])
          PY
      - name: Commit R11 asset and remove one-time importer
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/import-cricket-stadium-r11.yml
          git add public/models/cricket-stadium-colosseum-r11.glb .github/workflows/import-cricket-stadium-r11.yml
          git commit -m "Import cricket stadium colosseum r11"
          git push origin HEAD:main
