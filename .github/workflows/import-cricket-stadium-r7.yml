name: Import Cricket Stadium R7

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-cricket-stadium-r7.yml"

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download verified R7 GLB
        run: |
          set -euo pipefail
          mkdir -p public/models
          curl --fail --location --retry 2             "https://d2ol7oe51mr4n9.cloudfront.net/user_3BjwTJYCzFGxri4Mx2xQr2GkqBc/c0aec6f0-1e69-4484-8ab6-770f7f82ad1f.zip"             -o /tmp/cricket-stadium-colosseum-r7.zip
          unzip -j /tmp/cricket-stadium-colosseum-r7.zip             cricket-stadium-colosseum-r7.glb             -d public/models
          python - <<'PY'
          from pathlib import Path
          p=Path("public/models/cricket-stadium-colosseum-r7.glb")
          data=p.read_bytes()
          assert len(data)==4231984, f"unexpected GLB size: {len(data)}"
          assert data[:4]==b"glTF", "invalid GLB header"
          print("verified", len(data), data[:4])
          PY
      - name: Commit R7 asset and remove one-time importer
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/import-cricket-stadium-r7.yml
          git add public/models/cricket-stadium-colosseum-r7.glb .github/workflows/import-cricket-stadium-r7.yml
          git commit -m "Import cricket stadium colosseum r7"
          git push origin HEAD:main
