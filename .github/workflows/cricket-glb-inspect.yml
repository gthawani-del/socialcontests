name: Cricket GLB Inspect

on:
  push:
    paths:
      - 'public/models/cricket-world-v2.glb'
      - 'scripts/inspect-cricket-glb.mjs'
      - '.github/workflows/cricket-glb-inspect.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect cricket GLB
        run: node scripts/inspect-cricket-glb.mjs
      - name: Commit inspection report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/game/cricket-glb-inspection.json
          if git diff --cached --quiet; then
            echo "Inspection report unchanged"
          else
            git commit -m "Update Cricket GLB inspection report"
            git push
          fi
