name: Football Crash physics regression
on:
  pull_request:
    paths:
      - 'src/football-pinball/**'
      - 'tests/football-crash-motion.test.mjs'
      - '.github/workflows/football-crash-qa.yml'
  workflow_dispatch:
jobs:
  physics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Crash collision and scoring
        run: node --test tests/football-crash-motion.test.mjs
