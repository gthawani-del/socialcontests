<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#04070d" />
    <meta name="description" content="Infinite Pinball — Paris Nights production theme." />
    <title>Infinite Pinball · Paris Nights</title>
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>

      <div class="hud">
        <div class="brand">
          <div class="eyebrow">SOCIAL CONTESTS</div>
          <h1>INFINITE PINBALL</h1>
          <p>Paris Nights · Playable V1</p>
        </div>

        <div class="status" id="status">Starting…</div>
        <div class="ball-state" id="ballState">BALL —</div>
      </div>

      <div class="controls">A / ← LEFT · D / → RIGHT · R RESET</div>

      <div class="flipper-controls" aria-label="Pinball controls">
        <button class="flipper-button left" type="button" data-flipper="left" aria-label="Left flipper">LEFT</button>
        <button class="flipper-button right" type="button" data-flipper="right" aria-label="Right flipper">RIGHT</button>
      </div>

      <button class="reset-view" id="resetView" type="button" disabled>RESET VIEW</button>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
